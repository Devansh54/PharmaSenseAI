stages:
  - test

variables:
  POSTGRES_DB: pharmasense
  POSTGRES_USER: pharmasense
  POSTGRES_PASSWORD: pharmasense
  PHARMASENSE_DATABASE_URL: "postgresql+psycopg2://pharmasense:pharmasense@postgres:5432/pharmasense"
  PHARMASENSE_TEST_DATABASE_URL: "postgresql+psycopg2://pharmasense:pharmasense@postgres:5432/pharmasense"

phase1_audit_and_tests:
  stage: test
  image: python:3.11-slim
  services:
    # pgvector/pgvector:pg16 is postgres:16 plus the pgvector extension.
    # Needed because this job runs the full shared Alembic history
    # (including 0002_phase3_rag_foundation's CREATE EXTENSION vector),
    # even though Phase 1 itself has no vector columns.
    - name: pgvector/pgvector:pg16
      alias: postgres
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m alembic -c alembic.ini upgrade head
    - python -m phase1.ingestion.import_csvs
    - python -m phase1.audit.run_audit
    - python -m phase1.ingestion.drift
    - pytest -v tests/
  artifacts:
    when: always
    paths:
      - phase1/reports/
      - phase1/provenance/
    expire_in: 30 days

phase2_llm_gateway_tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest -v tests/test_llm_gateway.py tests/test_usage.py tests/test_openai_adapter.py tests/test_llm_gateway_smoke.py

phase3_rag_foundation_tests:
  stage: test
  image: python:3.11-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m alembic -c alembic.ini upgrade head
    - python -m phase1.ingestion.import_csvs
    - python -m phase3.ingestion
    - python -m phase3.baseline
    - pytest -v tests/test_rag_chunking.py tests/test_rag_embeddings.py tests/test_rag_ingestion.py tests/test_rag_retrieval.py tests/test_rag_references.py tests/test_rag_baseline.py
  artifacts:
    when: always
    paths:
      - phase3/reports/
    expire_in: 30 days
