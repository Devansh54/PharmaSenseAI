services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pharmasense-db
    environment:
      POSTGRES_USER: pharmasense
      POSTGRES_PASSWORD: pharmasense
      POSTGRES_DB: pharmasense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasense -d pharmasense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
