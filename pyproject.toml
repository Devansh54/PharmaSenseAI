[project]
name = "pharmasenseai"
version = "0.2.0"
description = "PharmaSenseAI R&D analysis application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.2",
    "SQLAlchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",
    "python-dotenv==1.0.1",
    "openai>=1.40.0,<2.0.0",
    "jsonschema>=4.17,<5.0.0",
    "pgvector>=0.2.0,<0.4.0",
    "sentence-transformers>=2.6.0,<4.0.0",
    "openpyxl",
    "langgraph>=1.2,<2",
    "langchain-core>=1.2,<2",
    "google-genai>=2.28.0",
    "groq>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmasense"]
